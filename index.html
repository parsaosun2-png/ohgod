<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Enigma</title>
    <style>
        body {
            background-color: #050505;
            color: #dcdcdc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .riddle-container {
            text-align: center;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 80%);
            padding: 60px 50px;
            border: 1px solid #222;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.02);
            animation: fadeIn 4s ease-in-out;
            position: relative;
        }
        .riddle-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, transparent, #3a3a3a, transparent);
            z-index: -1;
            border-radius: 17px;
            animation: borderGlow 6s linear infinite;
        }
        .riddle-text {
            font-size: 26px;
            line-height: 2;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            color: #b0b0b0;
        }
        .title {
            font-size: 14px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes borderGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="riddle-container">
        <div class="title">Solve the Enigma</div>
        <div class="riddle-text">
            He lives in shadows,<br>
            he is fear himself.<br>
            <br>
            Killer like Thanos,<br>
            eye like pimple.
        </div>
    </div>
</body>
</html>
